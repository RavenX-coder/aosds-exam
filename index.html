<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>AOSDS 考試 AOSDS Examination</title>
<style>
:root{
  --green-dark:#0e5c3f;
  --green:#1c7a4f;
  --green-light:#2f9c66;
  --navy:#132a3a;
  --panel:#5c7f92;
  --bg:#e9edf0;
  --card:#ffffff;
  --ink:#1c2b33;
  --muted:#6b7c85;
  --amber:#f0ad2e;
  --red:#d64545;
  --line:#d7dee2;
  font-family:-apple-system,"Segoe UI","PingFang HK","Microsoft JhengHei",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);height:100%;}
body{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
  display:flex;
  flex-direction:column;
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
#app{max-width:900px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:100vh;background:var(--bg);}

/* ---------- Header ---------- */
.hdr{
  background:linear-gradient(135deg,var(--green-dark),var(--green-light));
  color:#fff;
  padding:12px 14px 10px;
  flex-shrink:0;
}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.hdr-titles{min-width:0;flex:1;}
.hdr-titles h1{font-size:clamp(14px,4.2vw,17px);margin:0 0 1px;font-weight:700;letter-spacing:.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-titles p{font-size:11px;margin:0;opacity:.88;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.finish-btn{
  background:#dfe3e6;color:#8a9199;border:none;font-size:12.5px;font-weight:700;
  padding:8px 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:4px;
  white-space:nowrap;min-height:36px;
}
.finish-btn.enabled{background:#2fae5a;color:#ffffff;cursor:pointer;}
.finish-btn.hidden{display:none !important;}
.back-btn{
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.4);
  color:#fff;font-size:12.5px;font-weight:700;
  padding:8px 11px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:3px;
  white-space:nowrap;min-height:36px;
}
.back-btn:active{background:rgba(255,255,255,.32);}

/* ---------- Body / question ---------- */
.body-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 10px;}

.qcard{
  background:var(--panel);
  border-radius:10px;
  padding:16px 14px 16px 52px;
  position:relative;
  color:#fff;
  margin-bottom:14px;
  box-shadow:0 2px 6px rgba(0,0,0,.12);
}
.qnum{
  position:absolute;left:-2px;top:-2px;
  width:34px;height:34px;border-radius:50%;
  background:var(--amber);color:#3a2a00;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;
  border:3px solid var(--bg);
  transition:background .15s;
}
.qnum.rw-correct{background:#2fae5a;color:#fff;font-size:17px;}
.qnum.rw-wrong{background:var(--red);color:#fff;font-size:17px;}
.qtext{font-size:15px;line-height:1.5;font-weight:600;margin:0 0 4px;}
.qsub{font-size:13.5px;line-height:1.48;opacity:.97;margin:9px 0 0;}
.qsub .roman{font-weight:700;margin-right:6px;opacity:.9;}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
@media (max-width:560px){.opts{grid-template-columns:1fr;}}
.opt{
  background:var(--card);border:2px solid var(--line);border-radius:9px;
  padding:12px 13px;display:flex;align-items:flex-start;gap:10px;
  cursor:pointer;min-height:52px;position:relative;
  transition:border-color .12s, background .12s;
}
.opt:active{border-color:#a9b8bf;}
.opt.selected{border-color:var(--green);background:#eef8f1;}
.opt .letter{
  flex-shrink:0;width:25px;height:25px;border-radius:6px;background:#e3e7e9;color:#5b6a71;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;
}
.opt.selected .letter{background:var(--green);color:#fff;}
.opt .otext{font-size:13.5px;line-height:1.42;padding-top:1px;padding-right:20px;}
.opt .mark{position:absolute;right:10px;bottom:10px;font-size:19px;line-height:1;font-weight:800;}
.opt .mark.mk-correct{color:#2fae5a;}
.opt .mark.mk-wrong{color:var(--red);}
.opt.correct-answer{border-color:#3aa15c;background:#e6f6ea;cursor:default;}
.opt.wrong-selected{border-color:var(--red);background:#fbe9e9;cursor:default;}
.opt.readonly{cursor:default;}
.opt.readonly:active{border-color:inherit;}

/* ---------- Bottom nav ---------- */
.navbar{
  background:#f3f5f6;border-top:1px solid var(--line);
  padding:9px 8px;display:flex;align-items:center;gap:6px;flex-shrink:0;
}
.navbtn{
  flex-shrink:0;width:38px;height:38px;border-radius:50%;border:1px solid #b9c6cc;
  background:#fff;color:#4a5a62;font-size:17px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.navbtn:disabled{opacity:.35;cursor:default;}
.pills{flex:1;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:78px;overflow-y:auto;padding:2px 0;}
.pill{
  width:30px;height:30px;border-radius:50%;border:1px solid #c3ccd0;background:#fff;color:#5c6b72;
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;
}
.pill.current{border:2px solid var(--amber);color:#8a6100;}
.pill.answered{background:#dcecdf;border-color:#8fc19f;color:#2c6b3f;}
.pill.rw-wrong{background:#f7dcdc;border-color:#e0a3a3;color:#a13333;}
.pill.rw-correct{background:#d7f0dd;border-color:#7fbf93;color:#1f6b39;}
.pill.rw-current{border:2px solid var(--amber);}

/* ---------- Start / Result screens ---------- */
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px;text-align:center;}
.screen h2{font-size:19px;margin:0 0 6px;color:var(--green-dark);}
.screen p{color:var(--muted);font-size:13.5px;line-height:1.6;max-width:420px;margin:4px 0 0;}
.startcard{
  background:#fff;border-radius:14px;padding:26px 22px;max-width:420px;width:100%;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}
.big-btn{
  margin-top:20px;background:var(--green);color:#fff;border:none;border-radius:9px;
  padding:14px 24px;font-size:15px;font-weight:700;cursor:pointer;width:100%;min-height:48px;
}
.big-btn:active{background:var(--green-dark);}
.big-btn.secondary{background:#fff;color:var(--green-dark);border:2px solid var(--green);margin-top:10px;}
.stat-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:11px;margin-top:14px;}
.stat-row b{color:var(--ink);}

.score-big{font-size:clamp(40px,13vw,52px);font-weight:800;margin:8px 0 0;}
.pass{color:#1f8a4c;}
.fail{color:var(--red);}
.badge{
  display:inline-block;margin-top:6px;padding:6px 16px;border-radius:20px;font-weight:800;font-size:13px;
}
.badge.pass{background:#e1f5e8;color:#1f8a4c;}
.badge.fail{background:#fbe4e4;color:var(--red);}

.hidden{display:none !important;}
footer.note{font-size:10.5px;color:#95a0a5;text-align:center;padding:8px 12px;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(20,30,35,.5);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-box{
  background:#fff;border-radius:12px;padding:22px 20px 18px;max-width:360px;width:100%;
  box-shadow:0 8px 30px rgba(0,0,0,.25);text-align:center;
}
.modal-box p{font-size:14px;line-height:1.6;color:var(--ink);white-space:pre-line;margin:0 0 18px;}
.modal-btns{display:flex;gap:10px;}
.modal-btns button{
  flex:1;padding:11px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;border:none;min-height:44px;
}
.modal-btns .mb-cancel{background:#eef1f2;color:#4a5a62;}
.modal-btns .mb-ok{background:var(--green);color:#fff;}

@media (max-width:360px){
  .hdr-titles p{display:none;}
  .back-btn span.lbl, .finish-btn span.lbl{display:none;}
}
</style>
</head>
<body>
<div id="app">

  <!-- START SCREEN -->
  <div id="startScreen" class="screen">
    <div class="startcard">
      <h2>AOSDS 考試</h2>
      <p>AOSDS Examination — 模擬練習</p>
      <div class="stat-row"><span>題庫總題數</span><b id="bankTotal">—</b></div>
      <div class="stat-row"><span>本次抽考題數</span><b>40 題</b></div>
      <div class="stat-row"><span>合格分數</span><b>70% (28/40)</b></div>
      <button class="big-btn" id="startBtn">開始考試 Start Exam</button>
    </div>
  </div>

  <!-- EXAM / REVIEW SCREEN (shared) -->
  <div id="examScreen" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0;">
    <div class="hdr">
      <div class="hdr-top">
        <div class="hdr-titles">
          <h1 id="hdrTitle">AOSDS 考試</h1>
          <p id="hdrSubtitle">AOSDS Examination</p>
        </div>
        <div class="hdr-actions">
          <button class="back-btn" id="backBtn">&#8249; <span class="lbl" id="backBtnLbl">返回</span></button>
          <button class="finish-btn" id="finishBtn">完成 ▶</button>
        </div>
      </div>
    </div>

    <div class="body-scroll" id="bodyScroll">
      <div class="qcard">
        <div class="qnum" id="qNum">1</div>
        <p class="qtext" id="qText"></p>
        <div id="qSubs"></div>
      </div>
      <div class="opts" id="optsWrap"></div>
    </div>

    <div class="navbar">
      <button class="navbtn" id="prevBtn">&#8249;</button>
      <div class="pills" id="pills"></div>
      <button class="navbtn" id="nextBtn">&#8250;</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="hidden screen" style="justify-content:flex-start;padding-top:32px;">
    <h2>考試結果 Result</h2>
    <div class="score-big" id="scoreBig">0/40</div>
    <div class="badge" id="badge">—</div>
    <p id="scorePct"></p>
    <button class="big-btn" id="reviewBtn" style="max-width:320px;">查看詳解 Review Answers</button>
    <button class="big-btn secondary" id="retryBtn" style="max-width:320px;">重新抽題再考 Retake</button>
  </div>

  <footer class="note">練習工具僅供自我測驗參考，非官方 AOSDS 考試系統。</footer>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <p id="modalMsg"></p>
      <div class="modal-btns">
        <button class="mb-cancel" id="modalCancel">取消 Cancel</button>
        <button class="mb-ok" id="modalOk">確定 OK</button>
      </div>
    </div>
  </div>
</div>

<script>
const FULL_BANK = [{"q": "To what must you give the greatest priority when an incident occurs?", "options": ["Speed of response", "Ensuring that all relevant people are informed", "Safety of passengers and staff", "Preservation of evidence"], "correct": "Safety of passengers and staff"}, {"q": "What must staff ensure of otherwise they must not lean out of any door or window of a vehicle?", "options": ["Ensure safe to do so", "Informed Safety Officer", "Isolated and Earthed", "Informed Train Crew Officer"], "correct": "Ensure safe to do so"}, {"q": "What is the difference between the duties of a Handsignalman and a Lookoutman?", "options": ["Both of them are competent at giving warning of approaching trains when staff are working on or near a track but a Handsignalman is competent at mainline while a Lookoutman is competent at depot tracks only.", "A Handsignalman is qualified for controlling train movements and a Lookoutman is competent to warn and protect staff working on or near a track.", "During signaling equipment failure, a Lookoutman is responsible for controlling train movements.", "They have no difference. A Lookoutman can also act as a Handsignalman in controlling train movements."], "correct": "A Handsignalman is qualified for controlling train movements and a Lookoutman is competent to warn and protect staff working on or near a track."}, {"q": "You have been using a trolley and other portable equipment during work. What must you do to minimize risk after work has finished? i. Remove the equipment from any place where they may be a hazard ii. Place the equipment inside nearby plant room away from the public iii. Secure the trolley by chain and padlock iv. Assign security staff to monitor the equipment", "options": ["Only i, iii", "Only ii, iv", "Only i, iv", "Only iii, iv"], "correct": "Only i, iii"}, {"q": "What is the minimum safe distance when working near 1500V d.c. equipment?", "options": ["1.7 metres", "2 metres", "2.2 metres", "1.5 metres"], "correct": "2 metres"}, {"q": "What is the definition of a \"Circuit Main Earth\"?", "options": ["Substance which permits flow of electricity", "Substance which not permits flow of electricity", "Any earth, whether portable or integral with the equipment, which is applied prior to issue of a Permit-to-Work (High Voltage and Traction Voltage) or Sanction-for-Test", "Transmission line or cable in the electrical power distribution system"], "correct": "Any earth, whether portable or integral with the equipment, which is applied prior to issue of a Permit-to-Work (High Voltage and Traction Voltage) or Sanction-for-Test"}, {"q": "Flammable and dangerous substances must not be used or stored at a worksite except with written approval. lf flammable material must be use, which of the following handle technique is wrong?", "options": ["Quantity must be minimised and must not exceed 35 litres in aggregate", "It must be stored in a properly labelled closed lid metal container away from all sources of heat", "Base on Competent Person's own decision", "It must be in metal containers specially designed for the purpose"], "correct": "Base on Competent Person's own decision"}, {"q": "A staff accidentally comes into contact with a equipment that may be live at an unknown voltage, what immediate action must you take? i. If all parts of the person are further than one metre from a conductor, ensure that they do not get closer than that safety distance during removal ii. For investigation purposes, the equipment statuses must be maintained at the time of occurrence when rescuing iii. If the person is within one metre of a conductor, have current switched off before touching iv. Call for assistance from an Authorised Person", "options": ["Only i & iii", "Only iv", "Only ii & iii", "Only i, ii & iv"], "correct": "Only i & iii"}, {"q": "Compliance is an integral part of safety which is a prerequisite for railway operations. Hence, staff must obey which of the following requirements？ i. Internal work orders may override railway safety rules, procedures and instructions ii. For work that would affect safety should be carried out by supervisors or officials iii. Understand and abide by all Rules, Procedures and Instructions contained in the publications with which they are issued for their duties iv. Obey legitimate instructions given by supervisors and officials", "options": ["Only i, iv", "Only iii, iv", "Only ii, iii", "Only i, iii"], "correct": "Only iii, iv"}, {"q": "Within a worksite on track, only one vehicle can be authorised to move at any one time within a limit of movement. However, for the overhead line replacement work carried out by two moving vehicles, under which of the following conditions must these vehicles obey? i. These two vehicles must be operated at a speed of 5 km/h or below ii. These two vehicles must be kept a least 10 meters apart iii. These two vehicles must be operated from the leading driving cab iv. These two vehicles must be travelling in the same direction", "options": ["All the options", "Only i, iii, iv", "Only it, iii, iv", "Only i, ii, iv"], "correct": "Only i, iii, iv"}, {"q": "Staff working on or near mainline have to aware of which of the following condition?", "options": ["Inform the Traffic Controller once crossed the mainline", "Obtain the time limit of work from the Communication Controller", "Take particular care on curved track sections where they may be exposed to risk from end and centre throw of vehicles", "Arrange enough security guard"], "correct": "Take particular care on curved track sections where they may be exposed to risk from end and centre throw of vehicles"}, {"q": "What is a moveable rail section provided in sidings or depot outlet tracks which prevents a train from overrunning a signal at danger or proceeding beyond the limit of an authorized movement from reaching a fouling point called?", "options": ["Trailing points", "Trap points", "Hand-operated points", "Facing points"], "correct": "Trap points"}, {"q": "When you have to erect a scaffolding and working platform closer to overhead line equipment than the prescribed safety distance, what must you ensure? i. The last passenger train has departed ii. The worksite is within depot area iii. The overhead line equipment has been isolated iv. The overhead line equipment has been earth", "options": ["Only ii, iv", "Only i, ii", "Only ii, iii", "Only iii, iv"], "correct": "Only iii, iv"}, {"q": "Who is responsible to supervise train movements on mainline and connection tracks which within an Engineer's possession under authority of the Engineer's Person-in-Charge?", "options": ["Traffic Controller", "Engineer's Person-in-Charge", "Handsignalman", "Lookoutman"], "correct": "Engineer's Person-in-Charge"}, {"q": "What precaution must be done otherwise all electrical equipment, apparatus and conductors associated with the power distribution and traction current systems must be regarded as live at all times and dangerous to human life?", "options": ["Confirmed with the Station Controller that the power has been switched off", "The work is supervised by an Authorized Person", "The equipment has been properly isolated and earthed", "A Sanction for Test has been issued by an Authorized Person"], "correct": "The equipment has been properly isolated and earthed"}, {"q": "When all the persons are in the place of safety,what should they do for acknowledge warning which issued by Lookoutman?", "options": ["Raising one arm above the head", "Shouting", "Use mobile to contact Lookoutman", "Just ignore it"], "correct": "Raising one arm above the head"}, {"q": "What is it called with the distance between running rail faces in a single track?", "options": ["Track gauge", "Kinematic envelope", "Kinematic gauge", "Structure gauge"], "correct": "Track gauge"}, {"q": "During fire-fighting, what type of fire retardant must NOT be used to the area within the safe distance of live voltage, traction voltage or overhead line equipment directly which may cause electric shock? i. Water ii. Dry chemical iii. Electrical conductive iv. Carbon dioxide", "options": ["Only i, iv", "Only ii, iv", "Only i, iii", "Only ii, iii"], "correct": "Only i, iii"}, {"q": "What is it called when two or more locomotives which are coupled mechanically and electrically and are driven from a single driving position?", "options": ["Locomotives in series", "Locomotives in multiple", "Locomotives in line", "Battery locomotives"], "correct": "Locomotives in multiple"}, {"q": "Which of the following is NOT a Limitation-of-Access (High Voltage and Traction Voltage) is to define?", "options": ["Traffic hour of that location", "The limits and nature of the work", "The status of the concerned live equipment", "Safety precautions which must be followed"], "correct": "Traffic hour of that location"}, {"q": "When involved in applying protection within a possession and for controlling train movements. Who must have a means of immediate communication? i. Engineer's Person-in-Charge ii. Handsignalman iii. Competent Person iv. Lookoutman", "options": ["Only i, ii, iii", "Only i, ii, iv", "All the options", "Only ii, iii, iv"], "correct": "Only i, ii, iii"}, {"q": "During Traffic Hours, what will be the protection arrangements if staff are required to access tracks where there is limited clearance or no place of safety? i. Arrange a track trolley on the approach side of the worksite (for all lines) ii. Arrange a standing train on the approach side of the worksite (for all lines) iii. Arrange an engineering train on the approach side of the worksite (for all lines) iv. Hold a train at any platform from where trains can enter the worksite (except Light Rail)", "options": ["Only ii, iv", "Only ii, iii", "All the options", "Only i, iv"], "correct": "Only ii, iv"}, {"q": "What is it called for a switch used for sub-dividing an overhead line equipment section electrically?", "options": ["Section isolator", "Manual isolator", "Motorized isolator", "Infeed isolator"], "correct": "Section isolator"}, {"q": "What safety document must be issued before starting any work on or near high voltage or traction voltage equipment when the minimum safe distance cannot be maintained? i. Permit-to-Work (High Voltage and Traction Voltage) ii. Sanction-for-Test iii. Permit-to-Work (Mechanical) iv. Isolation Record Form", "options": ["Only i, ii, iv", "Only ii, iii, iv", "Only i, ii, iii", "Only i, iii, iv"], "correct": "Only i, ii, iv"}, {"q": "You are speaking to someone in a noisy environment. You require them to carry out a specific instruction concerning safety. According to the Railway Safety Rules, what must you do ?", "options": ["Speak loudly towards the person", "Repeat your specific instructions twice", "Ask the person to read back your specific instructions correctly", "Ask the person to clearly describe the specific instructions in words"], "correct": "Ask the person to read back your specific instructions correctly"}, {"q": "What must the Competent Person in charge ensure when work on High Voltage Apparatus?", "options": ["Ensure that all members of the working party know which apparatus is live and which is isolated", "Ensure that all members of the working party have proper schedule of their daily life", "Ensure enough security guard", "Ensure enough Lookoutman"], "correct": "Ensure that all members of the working party know which apparatus is live and which is isolated"}, {"q": "Except within a ________horns must be sounded a long blast when passing a danger signal.", "options": ["Possession", "Tailwall", "Station", "Depot"], "correct": "Possession"}, {"q": "What is the minimum safe distance when working near 750V d.c. equipment?", "options": ["2 metres", "2.2 metres", "1.7 metres", "1.5 metres"], "correct": "2 metres"}, {"q": "When staff are required to go onto a track where there is room for them to remain in a place of safety while trains pass, what safety precaution may be imposed if necessary for safety, by agreement between the Competent Person and Traffic Controller?", "options": ["Crowd control", "A temporary speed restriction", "Non-traffic hours", "Piston effect"], "correct": "A temporary speed restriction"}, {"q": "Why station staff have to inspect contractors' worksites regularly?", "options": ["To see whether the contractors have finished the work", "To assist the contractors if necessary", "To ensure the mutually agreed safety arrangements are followed", "To evaluate the quality of work done by the contractors"], "correct": "To ensure the mutually agreed safety arrangements are followed"}, {"q": "There are two worksites in a possession. What is the risk if no proper protection is arranged?", "options": ["Impede the working of Yard Master", "Impede the workers cleaning at site", "Impede the working of Traffic Controller", "An Engineering train could enter the wrong worksite"], "correct": "An Engineering train could enter the wrong worksite"}, {"q": "What protection will be arranged by the Competent Person for the pedestrian access work which must be carried out in a possession involving the working of trains and mechanised vehicles at RM mode?", "options": ["\"No Track Access\" warning boards", "Placing track circuit operating clip", "Placing red flashing lights (PA)", "Placing red flashing lights"], "correct": "Placing red flashing lights (PA)"}, {"q": "On Light Rail Mainline and Connection Track possession, when a train is operate at a speed over 60km/h, in what condition, the distance between the worksite and possession boundaries may be reduced to 100 metres?", "options": ["Only when the train is running on a ballast track", "Only when the traction current has been switched off", "The train can apply track brakes", "Absolutely not allowed because it will affect safety"], "correct": "The train can apply track brakes"}, {"q": "Which one is INCORRECT if a Competent Person in charge is going to be relieved before work completion on High Voltage Apparatus?", "options": ["Both Competent Persons and the Authorised Person must sign the transfer", "A Permit-to-Work (High Voltage and Traction Voltage) must be transferred to the person taking charge who must read it aloud to the Authorised Person", "The Authorised Person must inform the Power System Controller and ensure that personal padlocks are changed", "Inform Safety Officer"], "correct": "Inform Safety Officer"}, {"q": "Who is having written approval of the Engineer to operate specified equipment where formal qualification is required by the laws of Hong Kong?", "options": ["Lookoutman", "Qualified Person", "Pilotman", "Security Guard"], "correct": "Qualified Person"}, {"q": "The Rules for protection measures for an Engineer's possession must be followed in an emergency possession, except that the protection for a possession of overhead line recovery work is arranged by placing a red flashing light (engineering work) at a distance of not less than _ metres beyond all worksite boundaries.", "options": ["80", "50", "70", "60"], "correct": "50"}, {"q": "Who must be informed by the Competent Person and make agreement on the estimated additional time required and special arrangements if completion of work may delay switching on of traction current or passenger train service?", "options": ["Engineer", "Station Manager", "Traffic Controller", "Security Inspector"], "correct": "Traffic Controller"}, {"q": "How does a Lookoutman display an \"All Right\" handsignal when the concerned track is clear of persons, tools and materials? i. Holding a white light steadily above the head ii. Holding one arm above head iii. Waving a yellow flag slowly from side to side across body iv. Waving a yellow flag slowly up and down vertically", "options": ["Only ii, iii", "Only ii, iv", "Only iii, iv", "Only i, ii"], "correct": "Only ii, iii"}, {"q": "What is it called when the action of a train not calling at a station or stations?", "options": ["Overrun", "Set back", "Non-stop", "Stop"], "corre   for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildExam(){
  const pool = shuffle(FULL_BANK).slice(0, EXAM_SIZE);
  examQuestions = pool.map(item => ({
    q: item.q,
    options: shuffle(item.options),
    correct: item.correct
  }));
  userAnswers = new Array(examQuestions.length).fill(null);
  currentIndex = 0;
}

function splitQuestion(qtext){
  const markers = [' i. ', ' ii. ', ' iii. ', ' iv. '];
  const idxs = markers.map(m => qtext.indexOf(m));
  if(idxs.some(i => i === -1)) return {main: qtext, subs: null};
  for(let k=1;k<idxs.length;k++){ if(idxs[k] <= idxs[k-1]) return {main: qtext, subs: null}; }
  const main = qtext.slice(0, idxs[0]).trim();
  const subs = [];
  for(let k=0;k<4;k++){
    const start = idxs[k] + 1;
    const end = k < 3 ? idxs[k+1] : qtext.length;
    subs.push(qtext.slice(start, end).trim());
  }
  return {main, subs};
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderQuestion(){
  const item = examQuestions[currentIndex];
  const parts = splitQuestion(item.q);
  document.getElementById('qText').innerHTML = escapeHtml(parts.main);
  const subsWrap = document.getElementById('qSubs');
  if(parts.subs){
    subsWrap.innerHTML = parts.subs.map(line => {
      const m = line.match(/^(i{1,3}v?)\.\s*(.*)$/);
      const roman = m ? m[1] : '';
      const rest = m ? m[2] : line;
      return '<p class="qsub"><span class="roman">'+escapeHtml(roman)+'.</span>'+escapeHtml(rest)+'</p>';
    }).join('');
  } else {
    subsWrap.innerHTML = '';
  }

  const qNumEl = document.getElementById('qNum');
  const isReview = mode === 'review';
  const ua = userAnswers[currentIndex];
  const isCorrect = ua === item.correct;

  if(isReview){
    qNumEl.className = 'qnum ' + (isCorrect ? 'rw-correct' : 'rw-wrong');
    qNumEl.innerHTML = isCorrect ? '&#10003;' : '&#10005;';
  } else {
    qNumEl.className = 'qnum';
    qNumEl.textContent = currentIndex+1;
  }

  const wrap = document.getElementById('optsWrap');
  wrap.innerHTML = '';
  const letters = ['A','B','C','D'];
  item.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    let cls = 'opt';
    let markHtml = '';

    if(isReview){
      cls += ' readonly';
      if(opt === item.correct){
        cls += ' correct-answer';
        markHtml = '<span class="mark mk-correct">&#10003;</span>';
      } else if(opt === ua){
        cls += ' wrong-selected';
        markHtml = '<span class="mark mk-wrong">&#10005;</span>';
      }
    } else {
      if(ua === opt) cls += ' selected';
    }

    div.className = cls;
    div.innerHTML = '<div class="letter">'+letters[idx]+'</div><div class="otext">'+escapeHtml(opt)+'</div>'+markHtml;

    if(!isReview){
      div.onclick = () => {
        userAnswers[currentIndex] = opt;
        renderQuestion();
      };
    }
    wrap.appendChild(div);
  });

  document.getElementById('prevBtn').disabled = currentIndex===0;
  document.getElementById('nextBtn').disabled = currentIndex===examQuestions.length-1;
  document.getElementById('bodyScroll').scrollTop = 0;
  renderPills();
  if(!isReview) updateFinishBtnState();
}

function updateFinishBtnState(){
  const allAnswered = userAnswers.every(a => a!==null);
  document.getElementById('finishBtn').classList.toggle('enabled', allAnswered);
}

function showConfirm(message, onOk){
  const overlay = document.getElementById('modalOverlay');
  document.getElementById('modalMsg').textContent = message;
  overlay.classList.remove('hidden');
  const okBtn = document.getElementById('modalOk');
  const cancelBtn = document.getElementById('modalCancel');
  function cleanup(){
    overlay.classList.add('hidden');
    okBtn.onclick = null;
    cancelBtn.onclick = null;
  }
  okBtn.onclick = () => { cleanup(); onOk(); };
  cancelBtn.onclick = () => { cleanup(); };
}

function renderPills(){
  const wrap = document.getElementById('pills');
  wrap.innerHTML = '';
  const isReview = mode === 'review';
  examQuestions.forEach((item, i) => {
    const p = document.createElement('div');
    let cls = 'pill';
    if(isReview){
      const correct = userAnswers[i] === item.correct;
      cls += correct ? ' rw-correct' : ' rw-wrong';
      if(i===currentIndex) cls += ' rw-current';
    } else {
      if(i===currentIndex) cls += ' current';
      else if(userAnswers[i]!==null) cls += ' answered';
    }
    p.className = cls;
    p.textContent = i+1;
    p.onclick = () => { currentIndex = i; renderQuestion(); };
    wrap.appendChild(p);
  });
}

function goto(delta){
  currentIndex = Math.max(0, Math.min(examQuestions.length-1, currentIndex+delta));
  renderQuestion();
}

document.getElementById('prevBtn').onclick = () => goto(-1);
document.getElementById('nextBtn').onclick = () => goto(1);

document.getElementById('backBtn').onclick = () => {
  if(mode === 'review'){
    document.getElementById('examScreen').classList.add('hidden');
    document.getElementById('examScreen').style.display = 'none';
    document.getElementById('resultScreen').classList.remove('hidden');
    return;
  }
  showConfirm('返回主頁會放棄現時作答進度，確定要返回嗎？\n(Going back will discard your current progress. Continue?)', () => {
    document.getElementById('examScreen').classList.add('hidden');
    document.getElementById('examScreen').style.display = 'none';
    document.getElementById('startScreen').classList.remove('hidden');
  });
};

document.getElementById('startBtn').onclick = () => {
  mode = 'exam';
  buildExam();
  enterExamHeader();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('examScreen').classList.remove('hidden');
  document.getElementById('examScreen').style.display = 'flex';
  renderQuestion();
};

function enterExamHeader(){
  document.getElementById('hdrTitle').textContent = 'AOSDS 考試';
  document.getElementById('hdrSubtitle').textContent = 'AOSDS Examination';
  document.getElementById('backBtnLbl').textContent = '返回';
  document.getElementById('finishBtn').classList.remove('hidden');
}

function enterReviewHeader(){
  document.getElementById('hdrTitle').textContent = '作答回顧';
  document.getElementById('hdrSubtitle').textContent = 'Answer Review';
  document.getElementById('backBtnLbl').textContent = '結果';
  document.getElementById('finishBtn').classList.add('hidden');
}

document.getElementById('finishBtn').onclick = () => {
  const answered = userAnswers.filter(a=>a!==null).length;
  if(answered < examQuestions.length){
    showConfirm('仲有 '+(examQuestions.length-answered)+' 題未作答，確定要交卷嗎？\n('+(examQuestions.length-answered)+' question(s) unanswered. Submit anyway?)', () => {
      showResult();
    });
    return;
  }
  showResult();
};

function showResult(){
  let correctCount = 0;
  examQuestions.forEach((item,i) => { if(userAnswers[i]===item.correct) correctCount++; });
  const pct = Math.round((correctCount/examQuestions.length)*100);
  const passed = correctCount/examQuestions.length >= PASS_RATIO;

  document.getElementById('examScreen').classList.add('hidden');
  document.getElementById('examScreen').style.display = 'none';
  document.getElementById('resultScreen').classList.remove('hidden');

  document.getElementById('scoreBig').textContent = correctCount+'/'+examQuestions.length;
  document.getElementById('scoreBig').className = 'score-big ' + (passed?'pass':'fail');
  document.getElementById('badge').textContent = passed ? '合格 PASS' : '不合格 FAIL';
  document.getElementById('badge').className = 'badge ' + (passed?'pass':'fail');
  document.getElementById('scorePct').textContent = '得分率 '+pct+'%　(合格線 70%)';
}

document.getElementById('reviewBtn').onclick = () => {
  mode = 'review';
  currentIndex = 0;
  enterReviewHeader();
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('examScreen').classList.remove('hidden');
  document.getElementById('examScreen').style.display = 'flex';
  renderQuestion();
};

document.getElementById('retryBtn').onclick = () => {
  mode = 'exam';
  document.getElementById('resultScreen').classList.add('hidden');
  buildExam();
  enterExamHeader();
  document.getElementById('examScreen').classList.remove('hidden');
  document.getElementById('examScreen').style.display = 'flex';
  renderQuestion();
};
</script>
